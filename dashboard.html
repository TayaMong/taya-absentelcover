<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Absensi QR Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Library Scanner QR & Generator QR -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <div class="phone-frame">
    <div class="bg-orb orb-top-left"></div>
    <div class="bg-orb orb-mid-right"></div>
    <div class="bg-orb orb-bottom-left"></div>
    <div class="bg-orb orb-bottom-right"></div>

    <!-- Top Action Buttons (Logout & Theme) -->
    <button class="logout-top-btn neu-card" id="logoutBtn" aria-label="Logout" title="Keluar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" />
        <polyline points="16 17 21 12 16 7" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="21" y1="12" x2="9" y2="12" stroke-linecap="round" />
      </svg>
    </button>

    <button class="theme-toggle neu-card" id="themeToggle" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <!-- DASHBOARD CONTAINER -->
    <main class="screen" id="dashboardScreen">
      <div id="tabContent"></div>

      <!-- Bottom Navigation: 2 Tab Utama -->
      <nav class="bottom-nav neu-card" aria-label="Navigasi Absensi">
        <button class="nav-item active" data-tab="scan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" stroke-linecap="round" />
            <line x1="4" y1="12" x2="20" y2="12" stroke-linecap="round" />
          </svg>
          <span>Scan QR</span>
        </button>

        <button class="nav-item" data-tab="generate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <path d="M14 14h3v3h-3zM18 18h3v3h-3z" />
          </svg>
          <span>Buat QR Mahasiswa</span>
        </button>
      </nav>

      <footer class="screen-footer">
        <div class="tagline">GOOGLE SHEETS INTEGRATED</div>
      </footer>
    </main>
  </div>

  <script src="apps.js"></script>
</body>
</html>
