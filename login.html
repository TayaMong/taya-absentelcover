<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Absensi QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-frame">
    <div class="bg-orb orb-top-left"></div>
    <div class="bg-orb orb-mid-right"></div>
    <div class="bg-orb orb-bottom-left"></div>
    <div class="bg-orb orb-bottom-right"></div>

    <button class="theme-toggle neu-card" id="themeToggle" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <main class="screen" id="loginScreen">
      <div class="login-logo-box neu-card">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 19h2v2h-2zM19 14h2v2h-2z" fill="#2563eb" />
        </svg>
      </div>

      <h1 class="title-main">Admin Absensi</h1>
      <p class="subtitle-spaced">SISTEM PRESENSI QR MAHASISWA</p>

      <form class="login-form" id="loginForm">
        <div class="input-group neu-card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4" />
            <path d="M5 20c1.5-4 12.5-4 14 0" stroke-linecap="round" />
          </svg>
          <input type="text" id="usernameInput" placeholder="Username Admin" required />
        </div>

        <div class="input-group neu-card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="11" width="14" height="10" rx="2.5" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <input type="password" id="passwordInput" placeholder="Password" required />
          <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
              <path d="M3 3l18 18" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-primary login-btn">
          <span>Masuk Dashboard</span>
        </button>

        <p class="login-error" id="loginError" aria-live="polite"></p>
      </form>

      <footer class="screen-footer">
        <div class="tagline">SCAN &nbsp;•&nbsp; VERIFY &nbsp;•&nbsp; SYNC SHEETS</div>
      </footer>
    </main>
  </div>

  <script src="apps.js"></script>
</body>
</html>
